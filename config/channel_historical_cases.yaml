# 具名渠道历史案例库 v1.0
# 近 5 年真实台湾政治/政商揭弊案例（2020-2026）。
# 用途：为规则与 LLM 提供「哪类题材通常由哪类渠道首发/放大/核验」的参照。
# 角色分类：
#   FIRST_RELEASE   真正首次披露的媒体/个人（不是后续转载）
#   EARLY_AMPLIFIER 首发后第一波放大者
#   VERIFIER        事后核验/司法确认来源（检方、主管机关、校方等，不是首发）
# source_urls 为公开报道引用（供编辑部人工回查，非自动抓取）。
# 注：案例作为「经验参照」而非「事实主张依据」；时间、首发媒体以公开报道为准，
# 如编辑部有更正信息应更新本文件。
