cross_signal_bonuses:
- condition: 命中原始证据词>=2且存在具体人名/公司名/金额
  bonus: 10
- condition: 形成 人物->关系人->利益->权力动作 四段链条
  bonus: 12
- condition: 邮件包含此前未公开的新人物/新公司/新账户/新金额/新时间点
  bonus: 12
- condition: 命中正式调查或更高阶段S2-S6
  bonus: 8
- condition: 命中E4/E5终局性正式认定
  bonus: 10
