version: '1.0'
matching_policy:
  default: 组合规则优先于单关键词；H词可进入候选池，但高优先级通常需要2类以上信号共现
  window: 建议在同一邮件、同一段落或相邻3句内判断共现
  entity_linking: 若存在人名、机构、公司、项目、金额，应优先建立关系链
