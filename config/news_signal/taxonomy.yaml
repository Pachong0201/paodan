version: '1.0'
scope:
  primary_targets:
  - 民进党及其现任、曾任政治人物
  - 民进党中央及地方党部
  - 台湾地区行政机构及地方政府中与目标人物相关的官员
  - 与目标人物存在明确政治、行政、利益或组织关系的相关主体
  time_reference: 规则来源主要基于近5年公开报道案例
  principles:
  - 识别具体事实关系链，不以政治评价代替事实判断
  - 严格区分爆料、调查、起诉、判决、终局与反向结果
  - 允许一个事件归入多个类别
  - 私人生活仅在涉及违法、公职伦理、权势关系或公共利益时提高权重
evidence_stages:
  E0: 无事实基础或仅政治攻击/情绪表达
  E1: 爆料、质疑、检举、告发，尚未证实
  E2: 正式调查、搜索、约谈、列被告、行政/学伦调查
  E3: 起诉、弹劾、行政处分、正式机构认定
  E4: 法院有罪判决但尚未终局
  E5: 判决确定或其他最终正式认定
  EX: 不起诉、无罪、查无不法、不成立、改判无罪等反向结果
keyword_types:
  H: 高强度行为词
  M: 中强度异常/隐性表达
  C: 场景或关系词
  E: 原始证据词
  S: 程序与结果词
  X: 反向标识
