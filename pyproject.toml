[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paodan-news-screening"
version = "4.1.1"
description = "Taiwan political/governance complaint email screening engine V4.1.1"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "pypdf>=4.0",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
