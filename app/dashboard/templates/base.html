<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Paodan Dashboard{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='/dashboard.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <h1>Paodan 新闻线索 Dashboard</h1>
      <div class="subtitle">本地新闻线索筛选与人工复核工作台</div>
    </div>
    <nav>
      <a href="/">工作台</a>
      <a href="/import">导入邮件</a>
      <a href="/jobs">任务中心</a>
      <a href="/leads">高价值线索</a>
      <a href="/review">人工审核</a>
      <a href="/settings">设置</a>
    </nav>
  </div>
</header>
<main class="content">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>Paodan V5.0 Local Workbench</span>
  <span>仅本地使用，不展示原始正文；人工备注不影响系统评分</span>
</footer>
<script src="{{ url_for('static', path='/dashboard.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
