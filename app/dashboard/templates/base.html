<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Paodan Dashboard{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='/dashboard.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">PD</div>
      <div>
        <h1>Paodan 新闻线索 Dashboard</h1>
        <div class="subtitle">本地新闻线索筛选与人工复核工作台</div>
      </div>
    </div>
    {% set _path = request.url.path %}
    <nav>
      <a href="/" class="{% if _path == '/' %}active{% endif %}">工作台</a>
      <a href="/import" class="{% if _path.startswith('/import') %}active{% endif %}">导入邮件</a>
      <a href="/jobs" class="{% if _path.startswith('/jobs') %}active{% endif %}">任务中心</a>
      <a href="/leads" class="{% if _path.startswith('/leads') %}active{% endif %}">高价值线索</a>
      <a href="/review" class="{% if _path.startswith('/review') %}active{% endif %}">人工审核</a>
      <a href="/settings" class="{% if _path.startswith('/settings') %}active{% endif %}">设置</a>
    </nav>
  </div>
</header>
<main class="content">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>Paodan V5.0.2 Local Workbench</span>
  <span>仅本地使用，不展示原始正文；人工备注不影响系统评分</span>
</footer>
<script src="{{ url_for('static', path='/dashboard.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
